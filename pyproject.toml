[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-rec"
version = "0.1.0"
description = "Profile-driven research paper digest pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
paper-rec = "paper_rec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
